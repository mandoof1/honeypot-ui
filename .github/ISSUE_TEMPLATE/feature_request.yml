name: Feature request
description: Suggest an idea for HoneySentinel
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: "I'm always frustrated when ..."
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: What should the feature do and how should it look or behave?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any alternative solutions or features you've thought about.
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, sketches, links, or anything else that helps.