# Render blueprint for the HoneySentinel backend.
#
# The honeypot engine is intentionally NOT deployed here. Render's free web
# services only expose a single HTTP port and terminate TLS in front of it, so
# they cannot accept raw SSH/FTP connections on 2222/2121 - the engine would
# start, bind ports nothing can reach, and fail its health check. Run the
# engine on a host you control (see DEPLOY.md) and point it at this API.

databases:
  - name: honeysentinel-db
    plan: free
    databaseName: honeysentinel
    user: honeypot

services:
  - type: web
    name: honeysentinel-api
    runtime: python
    region: oregon
    plan: free
    healthCheckPath: /health
    buildCommand: |
      pip install -r backend/requirements.txt
      python -m spacy download en_core_web_sm
      # Everything below runs from backend/, matching startCommand's working
      # directory. MODEL_PATH_RF is relative, so building from the repository
      # root wrote the fitted models to <root>/models while the server looked
      # in <root>/backend/models - the artefacts were never found and every
      # cold start refitted them.
      cd backend
      mkdir -p models data
      # Fetch GeoLite2 when a licence key is configured. Without it sessions
      # are stored with no location rather than a fabricated one, and the map
      # has nothing to plot — which is finding 17.
      if [ -n "$MAXMIND_LICENSE_KEY" ]; then
        curl -fsSL "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-City&license_key=$MAXMIND_LICENSE_KEY&suffix=tar.gz" \
          -o /tmp/geo.tar.gz && tar -xzf /tmp/geo.tar.gz -C /tmp \
          && find /tmp -name '*.mmdb' -exec mv {} ./data/GeoLite2-City.mmdb \; \
          && echo "GeoLite2 installed" || echo "GeoLite2 download failed; locations will be null"
      else
        echo "MAXMIND_LICENSE_KEY unset; sessions will have no location"
      fi
      # Fit the bootstrap models at build time so the first request does not
      # pay for training.
      python -c "
      from app.ai.classifier import classifier
      from app.ai.anomaly_detector import anomaly_detector
      classifier._ensure_loaded()
      anomaly_detector._ensure_loaded()
      print('AI models initialised')
      "
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: honeysentinel-db
          property: connectionString
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: honeysentinel-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # Must match HONEYPOT_INGEST_TOKEN on the machine running the engine.
      # Copy the generated value out of the Render dashboard.
      - key: HONEYPOT_INGEST_TOKEN
        generateValue: true
      # Comma-separated. Set this to your deployed frontend origin.
      - key: CORS_ORIGINS
        sync: false
      # Render terminates TLS at its proxy, so client IPs arrive in
      # X-Forwarded-For. Rate limiting is per-IP and needs this.
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: SPACY_MODEL
        value: en_core_web_sm
      - key: MODEL_PATH_RF
        value: ./models/random_forest_model.pkl
      - key: MODEL_PATH_IF
        value: ./models/isolation_forest_model.pkl
      # Optional: MaxMind GeoLite2 database path. Without it sessions are
      # stored with no location rather than a fabricated one.
      - key: GEOIP_DB_PATH
        value: ./data/GeoLite2-City.mmdb
      # Free key from https://www.maxmind.com/en/geolite2/signup. Without it
      # the Live Map has no coordinates to plot.
      - key: MAXMIND_LICENSE_KEY
        sync: false
      # Optional alerting. Leave unset to disable.
      - key: ALERT_EMAIL_FROM
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
