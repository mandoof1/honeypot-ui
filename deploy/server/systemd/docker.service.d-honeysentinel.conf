# Installed by install.sh as /etc/systemd/system/docker.service.d/honeysentinel.conf.
#
# Docker must not start unless the egress rules for the decoy bridge are in
# place. The egress unit alone only *wanted* to run before Docker; if it
# failed at boot, Docker still came up and the engine had a way out until
# someone noticed. Requires= makes a failed egress unit a failed Docker start,
# which is the right outcome for a honeypot.
[Unit]
Requires=honeysentinel-egress.service
After=honeysentinel-egress.service
