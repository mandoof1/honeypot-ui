<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">HoneySentinel - Investigation Workspace</title>
  <desc id="desc">Monochrome AI-assisted honeypot session analysis, threat investigation, and export workspace</desc>
  <defs>
    <!-- Crisp High-Contrast Grid Pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
    </pattern>

    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>

    <clipPath id="panelClip">
      <rect x="-68" y="-18" width="174" height="118" rx="6"/>
    </clipPath>
  </defs>

  <style>
  <![CDATA[
    .spin {
      transform-box: fill-box;
      transform-origin: center;
      animation: spincw 18s linear infinite;
    }
    .spin-r {
      transform-box: fill-box;
      transform-origin: center;
      animation: spincw 26s linear infinite reverse;
    }
    .pulse {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulsey 3s ease-in-out infinite;
    }
    .blink {
      animation: blink 1.6s step-end infinite;
    }
    .dashmove {
      animation: dashmove 1.1s linear infinite;
    }
    .rows {
      animation: rows 4s ease-in-out infinite;
    }
    .scan {
      opacity: 0;
      animation: scan 7s linear infinite;
    }
    .floaty {
      animation: floaty 6s ease-in-out infinite;
    }

    @keyframes spincw {
      to { transform: rotate(360deg); }
    }
    @keyframes pulsey {
      0%, 100% { opacity: .35; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.16); }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: .15; }
    }
    @keyframes dashmove {
      to { stroke-dashoffset: -16; }
    }
    @keyframes rows {
      0% { transform: translateY(-22px); opacity: 0; }
      15% { opacity: .7; }
      85% { opacity: .7; }
      100% { transform: translateY(108px); opacity: 0; }
    }
    @keyframes scan {
      0% { transform: translateY(-30px); opacity: 0; }
      8% { opacity: .5; }
      92% { opacity: .5; }
      100% { transform: translateY(392px); opacity: 0; }
    }
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  ]]>
  </style>

  <!-- Solid Dark Background -->
  <rect width="1200" height="360" rx="18" fill="#000000"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>

  <!-- Tech Border Framing -->
  <path d="M0 2h1180l18 18v338H20L2 340V20Z" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Right Graphic: Monochrome UI Dashboard & Node Visual -->
  <g transform="translate(930, 180)">
    <g class="floaty">
    <!-- Outer Target Circles -->
    <circle r="135" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" class="pulse"/>
    <g class="spin">
      <circle r="100" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4,4"/>
    </g>

    <!-- UI Mockup Wireframe Shell -->
    <rect x="-140" y="-110" width="280" height="220" rx="10" fill="#090909" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5"/>
    
    <!-- Sidebar Representation -->
    <rect x="-140" y="-110" width="60" height="220" rx="10" fill="#121212" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
    <line x1="-120" y1="-80" x2="-95" y2="-80" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="-120" y1="-60" x2="-90" y2="-60" stroke="#71717a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-120" y1="-42" x2="-85" y2="-42" stroke="#a1a1aa" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-120" y1="-24" x2="-90" y2="-24" stroke="#71717a" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Active Tab Indicator -->
    <rect x="-122" y="-86" width="3" height="12" rx="1" fill="#ffffff" class="blink"/>

    <!-- Main Content Mockup -->
    <!-- Search Bar -->
    <rect x="-68" y="-95" width="130" height="18" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <line x1="58" y1="-92" x2="58" y2="-82" stroke="#ffffff" stroke-width="1.5" class="blink"/>
    <!-- Export Badges -->
    <rect x="70" y="-95" width="16" height="18" rx="3" fill="#27272a" class="blink"/>
    <rect x="90" y="-95" width="16" height="18" rx="3" fill="#27272a" class="blink" style="animation-delay:.8s"/>

    <!-- Active Session Row -->
    <rect x="-68" y="-68" width="174" height="42" rx="5" fill="#18181b" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1.5"/>
    <circle cx="96" cy="-47" r="4" fill="#ffffff" class="blink" style="animation-delay:.4s"/>
    <line x1="-58" y1="-54" x2="-10" y2="-54" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-58" y1="-40" x2="30" y2="-40" stroke="#71717a" stroke-width="2" stroke-linecap="round"/>

    <!-- Detail Inspection Panel -->
    <rect x="-68" y="-18" width="174" height="118" rx="6" fill="#000000" stroke="#3f3f46" stroke-width="1.2"/>
    <!-- Panel Header -->
    <line x1="-56" y1="-2" x2="-10" y2="-2" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Tags -->
    <rect x="-56" y="10" width="48" height="12" rx="6" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="1"/>
    <rect x="-4" y="10" width="44" height="12" rx="6" fill="#ffffff" fill-opacity="0.1" stroke="#a1a1aa" stroke-width="0.8"/>
    <!-- Data Grid Lines -->
    <line x1="-56" y1="36" x2="96" y2="36" stroke="#27272a" stroke-width="1"/>
    <line x1="-56" y1="52" x2="-20" y2="52" stroke="#71717a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="52" x2="60" y2="52" stroke="#71717a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-56" y1="68" x2="-10" y2="68" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="68" x2="70" y2="68" stroke="#a1a1aa" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Row Scanner Sweeping The Panel -->
    <g clip-path="url(#panelClip)">
      <rect x="-68" y="0" width="174" height="2" fill="#ffffff" opacity=".6" class="rows"/>
    </g>

    <!-- Threat Node Connection -->
    <g fill="#ffffff">
      <circle cx="-110" cy="70" r="5" filter="url(#soft)" class="pulse"/>
      <circle cx="-110" cy="70" r="3"/>
    </g>

    <path d="M-110 70 C -110 20, -60 20, -68 -47" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="4,4" class="dashmove"/>
    </g>
  </g>

  <!-- Typography & Information Section -->
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <!-- Eyebrow Category -->
    <text x="68" y="102" fill="#a1a1aa" font-size="13" letter-spacing="3.5" font-weight="600">INVESTIGATION WORKSPACE · REAL-TIME TRIAGE</text>

    <!-- Main Title -->
    <text x="64" y="172" fill="#ffffff" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="58" font-weight="800" letter-spacing="-2.5">Honey<tspan fill="#a1a1aa">Sentinel</tspan></text>

    <!-- Description Lines -->
    <text x="68" y="214" fill="#e4e4e7" font-size="18" font-family="ui-sans-serif, system-ui, sans-serif">Explore captured activity, inspect evidence, and share your findings.</text>
    <text x="68" y="244" fill="#71717a" font-size="16" font-family="ui-sans-serif, system-ui, sans-serif">Reconnaissance detection · ATT&amp;CK mappings · Filtered exports</text>

    <!-- Monochrome Feature Badges -->
    <g font-size="12" font-weight="700">
      <!-- Badge 1: Solid White High Contrast -->
      <rect x="68" y="280" width="118" height="32" rx="5" fill="#ffffff"/>
      <text x="84" y="301" fill="#000000">SESSIONS UI</text>

      <!-- Badge 2: Subtle Fill Dark Badge -->
      <rect x="198" y="280" width="152" height="32" rx="5" fill="#18181b" stroke="#a1a1aa" stroke-width="1"/>
      <text x="214" y="301" fill="#ffffff">RECONNAISSANCE</text>

      <!-- Badge 3: Outline Badge -->
      <rect x="362" y="280" width="190" height="32" rx="5" fill="none" stroke="#52525b" stroke-width="1"/>
      <text x="378" y="301" fill="#a1a1aa">CSV / JSON / CEF / STIX</text>
    </g>
  </g>

  <!-- Minimal Monochrome Accent Lines -->
  <rect x="0" y="354" width="340" height="6" fill="#ffffff"/>
  <rect x="1170" y="0" width="30" height="6" fill="#ffffff" class="blink"/>

  <!-- Full-Banner Scanning Sweep -->
  <rect x="0" y="0" width="1200" height="2" fill="#ffffff" class="scan"/>
</svg>