<svg xmlns="http://www.w3.org/2000/svg" width="716" height="450" viewBox="0 0 716 450" role="img" aria-labelledby="title description">
<title id="title">Classifier scores by class</title>
<desc id="description">F1 on a random per-flow CIC-IDS2017 holdout: benign 0.998, exploitation 0.993, reconnaissance 0.993, exfiltration 0.598. The model labelled every controlled attack session benign in a separate deployment test.</desc>
<defs>
  <linearGradient id="surface" x2="1" y2="1">
    <stop stop-color="#101724"/><stop offset="1" stop-color="#291a2b"/>
  </linearGradient>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#72566c" opacity=".43"/>
  </pattern>
  <style>@media (prefers-reduced-motion: reduce) { .motion { display: none; } }</style>
</defs>
<rect x="1" y="1" width="714" height="448" rx="20" fill="url(#surface)" stroke="#594358"/>
<rect x="2" y="2" width="712" height="446" rx="20" fill="url(#grid)" stroke="none"/>
<text x="28" y="50" fill="#fff4f2" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start">Classifier scores by class</text>
<text x="29" y="83" fill="#c2cedd" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">F1 on the held-out CIC-IDS2017 flow split</text>
<path d="M216 110V313" stroke="#594358" stroke-width="1" fill="none"/>
<text x="216" y="341" fill="#c2cedd" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" font-weight="400" text-anchor="middle">0</text>
<path d="M317 110V313" stroke="#594358" stroke-width="1" fill="none"/>
<text x="317" y="341" fill="#c2cedd" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" font-weight="400" text-anchor="middle">0.25</text>
<path d="M418 110V313" stroke="#594358" stroke-width="1" fill="none"/>
<text x="418" y="341" fill="#c2cedd" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" font-weight="400" text-anchor="middle">0.5</text>
<path d="M519 110V313" stroke="#594358" stroke-width="1" fill="none"/>
<text x="519" y="341" fill="#c2cedd" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" font-weight="400" text-anchor="middle">0.75</text>
<path d="M620 110V313" stroke="#594358" stroke-width="1" fill="none"/>
<text x="620" y="341" fill="#c2cedd" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" font-weight="400" text-anchor="middle">1</text>
<text x="28" y="146" fill="#fff4f2" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Benign</text>
<rect x="216" y="131" width="403" height="17" rx="4" fill="#8dcdf0" stroke="none"/>
<text x="684" y="146" fill="#8dcdf0" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="700" text-anchor="end">0.998</text>
<text x="28" y="197" fill="#fff4f2" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Exploitation</text>
<rect x="216" y="182" width="401" height="17" rx="4" fill="#8dcdf0" stroke="none"/>
<text x="684" y="197" fill="#8dcdf0" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="700" text-anchor="end">0.993</text>
<text x="28" y="248" fill="#fff4f2" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Reconnaissance</text>
<rect x="216" y="233" width="401" height="17" rx="4" fill="#8dcdf0" stroke="none"/>
<text x="684" y="248" fill="#8dcdf0" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="700" text-anchor="end">0.993</text>
<text x="28" y="299" fill="#fff4f2" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Exfiltration</text>
<rect x="216" y="284" width="242" height="17" rx="4" fill="#ff858c" stroke="none"/>
<text x="684" y="299" fill="#ff858c" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" font-weight="700" text-anchor="end">0.598</text>
<path d="M28 365H687" stroke="#594358" stroke-width="1.5" fill="none"/>
<text x="28" y="397" fill="#ff858c" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">Controlled deployment test</text>
<text x="28" y="426" fill="#c2cedd" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">The model labelled all five controlled attack sessions benign.</text>
</svg>
