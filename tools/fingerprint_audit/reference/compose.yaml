# Stock daemons to compare the decoys with. Every port is published on
# 127.0.0.1 only; nothing here is reachable from another machine.
#
#   docker compose -f tools/fingerprint_audit/reference/compose.yaml up -d --build sshd-focal
#   docker compose -f tools/fingerprint_audit/reference/compose.yaml down --rmi local
#
# Which reference matches which decoy claim:
#
#   sshd-focal     127.0.0.1:42022  SSH profile openssh-8.2p1-ubuntu
#                                   (banner OpenSSH_8.2p1 Ubuntu-4ubuntu0.9)
#   sshd-bullseye  127.0.0.1:42023  SSH profile openssh-8.4p1-debian
#                                   (banner OpenSSH_8.4p1 Debian-5+deb11u3)
#   apache-focal   127.0.0.1:42080  identity http_family apache (Apache/2.4.41 (Ubuntu))
#   nginx-focal    127.0.0.1:42081  identity http_family nginx (nginx/1.18.0 (Ubuntu))
#   vsftpd-focal   127.0.0.1:42021  identity ftp_family vsftpd (vsFTPd 3.0.3)
#   proftpd-focal  127.0.0.1:42026  identity ftp_family proftpd (ProFTPD 1.3.6c)
#   telnetd-focal  127.0.0.1:42123  the Telnet decoy (Ubuntu 20.04 login banner)
#
# The Ubuntu images install from snapshot.ubuntu.com as of 2023-11-15, when
# the archive's openssh-server was 1:8.2p1-4ubuntu0.9, the build the decoy's
# banner names, on a base image built the month before. The Debian image
# installs from the bullseye release pocket (point release 11.11), whose
# package index lists openssh-server 1:8.4p1-5+deb11u3.
name: hs-fingerprint-reference

x-focal: &focal
  BASE_IMAGE: ubuntu:focal-20231003
  ARCHIVE: 20231115T000000Z

x-bullseye: &bullseye
  BASE_IMAGE: debian:bullseye-20240110-slim
  ARCHIVE: release

services:
  sshd-focal:
    build:
      context: .
      args:
        <<: *focal
        SERVICE: sshd
    hostname: ref-focal
    ports:
      - "127.0.0.1:42022:22"

  sshd-bullseye:
    build:
      context: .
      args:
        <<: *bullseye
        SERVICE: sshd
    hostname: ref-bullseye
    ports:
      - "127.0.0.1:42023:22"

  apache-focal:
    build:
      context: .
      args:
        <<: *focal
        SERVICE: apache
    hostname: ref-focal
    ports:
      - "127.0.0.1:42080:80"

  nginx-focal:
    build:
      context: .
      args:
        <<: *focal
        SERVICE: nginx
    hostname: ref-focal
    ports:
      - "127.0.0.1:42081:80"

  # The FTP services publish the control port only. The audit records the
  # format of the PASV reply and never opens a data connection.
  vsftpd-focal:
    build:
      context: .
      args:
        <<: *focal
        SERVICE: vsftpd
    hostname: ref-focal
    ports:
      - "127.0.0.1:42021:21"

  proftpd-focal:
    build:
      context: .
      args:
        <<: *focal
        SERVICE: proftpd
    hostname: ref-focal
    ports:
      - "127.0.0.1:42026:21"

  telnetd-focal:
    build:
      context: .
      args:
        <<: *focal
        SERVICE: telnetd
    hostname: ref-focal
    ports:
      - "127.0.0.1:42123:23"
