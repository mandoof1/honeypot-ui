# Local development stack.
#
# The honeypot engine runs on an internal-only network with dropped
# capabilities and a read-only root filesystem. Only the backend bridges the
# isolated network and the outside world.

services:
  postgres:
    image: postgres:16-alpine
    container_name: honeysentinel-db
    environment:
      POSTGRES_USER: honeypot
      # Local-only credential. Override via .env for anything shared.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-honeypot}
      POSTGRES_DB: honeysentinel
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honeypot -d honeysentinel"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: honeysentinel-backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://honeypot:${POSTGRES_PASSWORD:-honeypot}@postgres:5432/honeysentinel
      DATABASE_URL_SYNC: postgresql+psycopg2://honeypot:${POSTGRES_PASSWORD:-honeypot}@postgres:5432/honeysentinel
      # Generated per-stack; see .env.example for how to produce real values.
      SECRET_KEY: ${SECRET_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      HONEYPOT_INGEST_TOKEN: ${HONEYPOT_INGEST_TOKEN:-local-dev-ingest-token}
      HONEYPOT_CONTROL_URL: http://honeypot:8000
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      SEED_ON_STARTUP: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - honeypot_isolated
    volumes:
      - ./backend:/app
      - model_data:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  honeypot:
    build:
      context: .
      dockerfile: honeypot/Dockerfile
    container_name: honeysentinel-honeypot
    environment:
      HONEYPOT_CONTAINER: "true"
      HONEYPOT_BIND_ADDRESS: 0.0.0.0
      HONEYPOT_SSH_PORT: "2222"
      HONEYPOT_FTP_PORT: "2121"
      HONEYPOT_HTTP_PORT: "8080"
      HONEYPOT_HTTPS_PORT: "8443"
      HONEYPOT_CONTROL_PORT: "8000"
      HONEYPOT_PROTOCOLS: ssh,ftp,http
      HONEYPOT_OPERATIONAL_MODE: active
      HONEYPOT_MAX_CONN_PER_IP: "5"
      HONEYPOT_RATE_LIMIT: "60"
      HONEYPOT_ANTI_FINGERPRINT: "true"
      HONEYPOT_ENABLE_ISOLATION: "true"
      HONEYPOT_DOCKER_NETWORK: honeypot_isolated
      HONEYPOT_ADAPTIVE_RESPONSE: "true"
      # A small passive range so FTP uploads (STOR) work; the port the server
      # advertises must be reachable from the client, which behind Docker's NAT
      # is the published host port, not the container address.
      HONEYPOT_FTP_PASV_PORTS: "50000-50009"
      HONEYPOT_FTP_PASV_ADDRESS: ${HONEYPOT_FTP_PASV_ADDRESS:-127.0.0.1}
      HONEYPOT_CAPTURE_DIR: /app/data/sessions
      HONEYPOT_FILE_CAPTURE_DIR: /app/data/uploads
      HONEYPOT_LOG_DIR: /app/data/logs
      BACKEND_API_URL: http://backend:8000/api/v1
      HONEYPOT_INGEST_TOKEN: ${HONEYPOT_INGEST_TOKEN:-local-dev-ingest-token}
    ports:
      # Emulated services, deliberately published so they can be probed.
      - "2222:2222"
      - "2121:2121"
      - "8080:8080"
      - "8443:8443"
      # FTP passive data channel; must match HONEYPOT_FTP_PASV_PORTS.
      - "50000-50009:50000-50009"
      # The control API is NOT published: it is reachable only from the
      # backend over the internal network.
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - honeypot_isolated
    volumes:
      - honeypot_data:/app/data
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100M
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: honeysentinel-frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - internal
    volumes:
      - .:/app
      - /app/node_modules

networks:
  internal:
    driver: bridge
  honeypot_isolated:
    driver: bridge
    # No route out to the internet: a process that escapes an emulator cannot
    # reach anything but the backend.
    internal: true
    ipam:
      config:
        - subnet: 10.0.0.0/24

volumes:
  pgdata:
  model_data:
  honeypot_data:
